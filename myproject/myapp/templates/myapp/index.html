{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book and Author Management</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      href="https://code.iconify.design/3/3.0.1/iconify.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <style>
      body {
        background-color: #f0f8ff;
      }
      .card {
        border: none;
        border-radius: 1rem;
      }
      .btn-primary {
        background-color: #007bff;
        border: none;
      }
      .btn-outline-secondary {
        color: #6c757d;
        border-color: #6c757d;
      }
      .btn-outline-danger {
        color: #dc3545;
        border-color: #dc3545;
      }
    </style>
  </head>
  <body>
    <div id="app" class="container mt-5">
      <!-- Author Management -->
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-4 text-primary">Authors</h2>
          <form @submit.prevent="addAuthor" class="mb-3">
            <div class="mb-3">
              <input
                v-model="newAuthor.name"
                placeholder="Author Name"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <textarea
                v-model="newAuthor.bio"
                placeholder="Bio"
                class="form-control"
              ></textarea>
            </div>
            <button class="btn btn-primary">
              <span class="iconify" data-icon="mdi:plus-circle-outline" style="vertical-align: middle;"></span> Add Author
            </button>
          </form>

          <!-- Edit Author Form -->
          <div v-if="editAuthor" class="mb-3">
            <div class="mb-3">
              <input v-model="editAuthor.name" class="form-control" required />
            </div>
            <div class="mb-3">
              <textarea v-model="editAuthor.bio" class="form-control"></textarea>
            </div>
            <button @click="updateAuthor" class="btn btn-success">
              <span class="iconify" data-icon="mdi:content-save-outline" style="vertical-align: middle;"></span> Update Author
            </button>
            <button @click="editAuthor = null" class="btn btn-secondary">
              <span class="iconify" data-icon="mdi:cancel" style="vertical-align: middle;"></span> Cancel
            </button>
          </div>

          <ul class="list-group mb-3">
            <li v-for="author in authors" :key="author.id" class="list-group-item">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <strong v-text="author.name"></strong>
                  <p class="mb-0 text-muted" v-text="author.bio"></p>
                </div>
                <div>
                  <button
                    @click="editAuthorDetails(author)"
                    class="btn btn-outline-secondary btn-sm me-2"
                  >
                    <span class="iconify" data-icon="mdi:account-edit-outline" style="vertical-align: middle;"></span> Edit
                  </button>
                  <button
                    @click="deleteAuthor(author.id)"
                    class="btn btn-outline-danger btn-sm"
                  >
                    <span class="iconify" data-icon="mdi:delete-outline" style="vertical-align: middle;"></span> Delete
                  </button>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>

      <!-- Book Management -->
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-4 text-primary">Books</h2>
          <form @submit.prevent="addBook" class="mb-3">
            <div class="mb-3">
              <input
                v-model="newBook.title"
                placeholder="Book Title"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <input
                v-model="newBook.publication_date"
                type="date"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <select 
                v-model="newBook.authors" 
                multiple 
                class="form-control"
                required
              >
                <option v-for="author in authors" :key="author.id" :value="author.id" v-text="author.name">
                </option>
              </select>
            </div>
            <small class="form-text text-muted mb-2 d-block">
              Hold Ctrl/Cmd to select multiple authors
            </small>
            <button class="btn btn-primary">
              <span class="iconify" data-icon="mdi:book-plus-outline" style="vertical-align: middle;"></span> Add Book
            </button>
          </form>

          <!-- Edit Book Form -->
          <div v-if="editBook" class="mb-3">
            <div class="mb-3">
              <input v-model="editBook.title" class="form-control" required />
            </div>
            <div class="mb-3">
              <input
                v-model="editBook.publication_date"
                type="date"
                class="form-control"
                required
              />
            </div>
            <div class="mb-3">
              <select 
                v-model="editBook.authors" 
                multiple 
                class="form-control"
                required
              >
                <option v-for="author in authors" :key="author.id" :value="author.id" v-text="author.name">
                </option>
              </select>
            </div>
            <small class="form-text text-muted mb-2 d-block">
              Hold Ctrl/Cmd to select multiple authors
            </small>
            <button @click="updateBook" class="btn btn-success">
              <span class="iconify" data-icon="mdi:content-save-outline" style="vertical-align: middle;"></span> Update Book
            </button>
            <button @click="editBook = null" class="btn btn-secondary">
              <span class="iconify" data-icon="mdi:cancel" style="vertical-align: middle;"></span> Cancel
            </button>
          </div>

          <ul class="list-group">
            <li v-for="book in books" :key="book.id" class="list-group-item">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <strong v-text="book.title"></strong> - <span v-text="book.publication_date"></span>
                  <div class="text-muted">
                    Authors: <span v-text="getAuthorsList(book.authors)"></span>
                  </div>
                </div>
                <div>
                  <button
                    @click="editBookDetails(book)"
                    class="btn btn-outline-secondary btn-sm me-2"
                  >
                    <span class="iconify" data-icon="mdi:book-edit-outline" style="vertical-align: middle;"></span> Edit
                  </button>
                  <button
                    @click="deleteBook(book.id)"
                    class="btn btn-outline-danger btn-sm"
                  >
                    <span class="iconify" data-icon="mdi:delete-outline" style="vertical-align: middle;"></span> Delete
                  </button>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script src="{% static 'myapp/app.js' %}"></script>
  </body>
</html>
